license="${mod_license}"
issueTrackerURL="https://github.com/raress96/GeoActivity/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Made by Decebaldecebal"
displayURL="https://minecraft.curseforge.com/projects/geoactivity"
description='''
Adds three new coal ores, a chemistry system with 19 elements, machines (including multiblocks and FE generators)
and modular tools and armor that can be upgraded with perks.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"
