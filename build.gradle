plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Resources produced by `./gradlew runData` (committed).
    srcDir('src/generated/resources')
    exclude('src/generated/**/.cache')
}

// GameTests live in their own source set so test code never ships in the release jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    // JEI
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 26.3 ships Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Smoke tests: -PquickPlay=<world> joins run/saves/<world>, -PquickPlayServer=<host:port> joins a server
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString(),
                        '--width', '1280', '--height', '720'
            } else if (project.hasProperty('quickPlayServer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('quickPlayServer').toString(),
                        '--width', '1280', '--height', '720'
            }
        }

        server {
            server()
            sourceSet = sourceSets.gametest
            // own directory, so a dev server and a dev client can run side by side
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every registered GameTest headless, then exits (non-zero on failure).
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }

    // JUnit tests run with the game bootstrapped.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

// Present for dev runs only; not published as a dependency.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    gametestRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
